name: Public runner
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock pytest
      - run: python -m pip install --no-deps -e .
      - run: python run.py check
      - run: python -m pytest -q
      - run: python scripts/check_release.py
